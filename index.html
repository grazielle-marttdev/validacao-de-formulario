<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio | Formulário de Validação</title>

    <link rel="stylesheet" href="src/css/reset.css">
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="src/css/responsive.css">
</head>
<body>
    <main>
        <div class="msg-intro">
            <h2>FICOU COM DÚVIDA?</h2>
            <h2>NOS MANDE UMA MENSAGEM!</h2>
            <p>Caso tenha ficado com qualquer dúvida basta nos mandar uma mensagem e entraremos em contato em menos de 24h.</p>
        </div>

        <form id="form-contato" novalidate>
            <div class="form-campos">
                <div class="campo-input">
                    <input type="text" name="nome" id="nome" placeholder="Digite seu primeiro nome *">
                    <span id="erro-nome" class="error">campo obrigatório</span>
                </div>

                <div class="campo-input">
                    <input type="email" name="email" id="email" placeholder="Digite seu email">
                    <span id="erro-email" class="error">campo obrigatório</span>
                </div>

                <div class="campo-input">
                    <input type="text" name="telefone" id="telefone" placeholder="Digite seu telefone">
                    <span id="erro-telefone" class="error">campo obrigatório</span>
                </div>

                <div class="campo-textarea">
                    <textarea name="mensagem" id="mensagem" placeholder="Digite sua mensagem *"></textarea>
                    <span id="erro-mensagem" class="error">campo obrigatório</span>
                </div>
            </div>

            <p>*campos obrigatórios</p>

            <button type="submit" id="btn-form">Enviar</button>
        </form>
    </main>

    <script type="module" src="src/js/validar-formulario.js"></script>
</body>
</html>
